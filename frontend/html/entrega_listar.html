<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/entrega_listar.js" defer></script>
    <title>Lista de Entregas - Logística Express</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>

    <main>
        <h1>Entregas</h1>
        <form>
            <label for="ordem">Ordenar por data</label><br>

            <button id="btn_listar">Listar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
