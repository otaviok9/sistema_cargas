<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/entrega_atualizar.js" defer></script>
    <title>Atualizar Entrega - Logística Express</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Atualizar Status da Entrega</h1>
        <form>
            <label for="id">Código da Entrega</label><br>
            <input type="number" id="id" required><br><br>

            <label for="status">Novo Status</label><br>
            <select id="status" required>
                <option value="">Selecione</option>
                <option value="TRANSITO">TRANSITO</option>
                <option value="ENTREGUE">ENTREGUE</option>
            </select><br><br>

            <button id="btn_atualizar">Atualizar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
